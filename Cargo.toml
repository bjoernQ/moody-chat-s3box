[package]
edition      = "2021"
name         = "live-chat-example"
rust-version = "1.88"
version      = "0.1.0"
description  = "Gemini Live voice companion with memory for the ESP32-S3-BOX-3"
license      = "GPL-3.0-or-later"
keywords     = ["esp32", "esp-hal", "embedded", "no-std"]
categories   = ["embedded", "no-std"]

[[bin]]
name = "live-chat-example"
path = "./src/bin/main.rs"

[dependencies]
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }
esp-hal = { version = "1.1.1", features = ["esp32s3", "log-04", "unstable"] }
log = "0.4.29"

embassy-net = { version = "0.7.0", features = [
  "dns",
  "dhcpv4",
  "log",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = "0.6.1"
embedded-io-async = "0.6.1"
esp-alloc = "0.10.0"
esp-sync = { version = "0.2.1", features = ["esp32s3"] }
esp-backtrace = { version = "0.19.0", features = [
  "esp32s3",
  "panic-handler",
  "println",
  "custom-halt",
] }
esp-println = { version = "0.17.0", features = ["esp32s3", "log-04"] }
critical-section = "1.2.0"
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.1", features = ["log"] }
esp-radio = { version = "0.18.0", features = [
  "esp-alloc",
  "esp32s3",
  "log-04",
  "wifi",
  "unstable",
] }
esp-rtos = { version = "0.3.0", features = [
  "log-04",
  "esp32s3",
  "embassy",
  "esp-radio",
] }
smoltcp = { version = "0.12.0", default-features = false, features = [
  "log",
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }
static_cell = { version = "2.1", features = ["nightly"] }
embassy-futures = "0.1.2"
embassy-sync = "0.7.2"
portable-atomic = "1.11.1"
embedded-nal-async = "0.8.0"
embedded-tls = { version = "0.17.0", default-features = false, features = ["log"] }
rand_core = { version = "0.6.4", default-features = false }

mipidsi = "0.8.0"
embedded-graphics-framebuf = "0.5.0"
embedded-graphics = "0.8.1"
display-interface = "0.5.0"
byte-slice-cast = { version = "1.2.2", default-features = false }
num-traits = { version = "0.2.19", default-features = false }
es8311 = "0.1.1"
es7210 = "0.1.0"
embedded-hal = "1.0.0"

esp-storage = { version = "0.8.1", features = ["esp32s3"] }
embedded-storage = "0.3.1"
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units    = 1
debug            = 2
debug-assertions = false
incremental      = false
lto              = "fat"
opt-level        = "s"
overflow-checks  = false
